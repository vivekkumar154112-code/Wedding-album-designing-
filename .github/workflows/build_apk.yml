name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Scaffold Complete Flutter Project
        run: |
          mkdir temp_app
          flutter create --org com.wedding.album temp_app
          cp -r temp_app/android ./
          cp -r temp_app/ios ./ 2>/dev/null || true
          rm -rf temp_app
          mkdir -p lib
          [ -f main.dart ] && mv main.dart lib/ || true
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml android/app/src/main/ || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wedding-Album-App-Release
          path: build/app/outputs/flutter-apk/app-release.apk
