name: auto_wedding_album
description: "Zero-touch automated wedding album builder for mobile with auto-enhancement and 300 DPI PDF export."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.0.0
  image_picker: ^1.1.0
  image: ^4.2.0
  pdf: ^3.10.8
  path_provider: ^2.1.2
  open_filex: ^4.4.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
